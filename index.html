<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="commun/css/base.css?v=8">
    <link rel="stylesheet" href="commun/css/themes.css?v=8">
    <style>
        main { max-width: 1040px; margin: 0 auto; padding: 40px 20px 60px; }
        h1 { font-size: 1.9rem; letter-spacing: -.02em; margin-bottom: 6px; }
        .lead { color: var(--muted); margin-bottom: 32px; }
        .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
        .game { padding: 20px; display: flex; flex-direction: column; gap: 10px; transition: border-color .12s, background .12s; }
        a.game:hover { border-color: var(--muted); background: var(--surface-2); }
        .game .ic { width: 44px; height: 44px; border-radius: 10px; background: var(--surface-3); display: grid; place-items: center; }
        .game .ic svg { width: 22px; height: 22px; }
        .game h3 { font-size: 1.05rem; }
        .game p { color: var(--muted); font-size: .88rem; line-height: 1.45; flex: 1; }
        .tag { align-self: flex-start; font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; padding: 3px 8px; border-radius: 4px; background: var(--surface-3); color: var(--muted); }
        .tag.live { background: var(--accent); color: var(--accent-ink); }
        .cat-title { display: flex; align-items: center; gap: 8px; font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 30px 0 12px; }
        .cat-title:first-child { margin-top: 0; }
        .tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .tag svg { width: 12px; height: 12px; vertical-align: -2px; margin-right: 3px; }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="./"><i data-icon="gamepad-2"></i> EPURE</a>
        <div class="spacer"></div>
        <a class="icon-btn hidden" id="account-btn" href="pages/account.html" title="Compte"><i data-icon="circle-user"></i></a>
        <a class="icon-btn" href="pages/stats.html" title="Statistiques"><i data-icon="chart-column"></i></a>
        <button class="icon-btn" id="theme-btn" title="Thème"><i data-icon="palette"></i></button>
    </header>
    <main>
        <h1>Epure</h1>
        <p class="lead">Des jeux classiques, revus proprement. Seul, contre un bot ou en duel 1v1.</p>
        <div id="games"></div>
    </main>

    <div class="modal hidden" id="settings">
        <div class="modal-card">
            <h2>Thème</h2>
            <div class="themes" id="themes"></div>
            <div class="modal-actions"><button class="btn primary" onclick="closeModals()">Fermer</button></div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="commun/js/config.js?v=8"></script>
    <script src="commun/js/i18n.js?v=8"></script>
    <script src="commun/js/ui.js?v=8"></script>
    <script src="commun/js/online.js?v=8"></script>
    <script src="commun/js/catalogue.js?v=8"></script>
    <script>
        // Cartes des jeux, construites depuis le catalogue (commun/js/catalogue.js)
        $('#games').innerHTML = CATEGORIES.map(([cat, label, ic]) => {
            const list = Object.entries(CATALOGUE).filter(([, g]) => g.cat === cat);
            return `<p class="cat-title">${icon(ic)}<span>${label}</span></p><div class="games">${list.map(([id, g]) => {
                const m = Object.keys(g.modes);
                const tags = [m.includes('duel') ? `<span class="tag live">${icon('swords')}1v1</span>` : '', m.includes('bot') ? `<span class="tag">${icon('bot')}Bot</span>` : '', m.includes('local') ? `<span class="tag">${icon('users')}À deux</span>` : ''].join('');
                return `<a class="game card" href="jeux/${id}/"><span class="ic">${icon(g.icon)}</span><h3>${g.name}</h3><p>${g.desc}</p><div class="tags">${tags}</div></a>`;
            }).join('')}</div>`;
        }).join('');
        renderThemes($('#themes'));
        hydrateIcons();
        $('#theme-btn').onclick = () => $('#settings').classList.remove('hidden');
        $('#settings').onclick = e => { if (e.target.id === 'settings') closeModals(); };
    </script>
</body>
</html>
