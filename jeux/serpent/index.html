<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Serpent · Epure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../commun/css/base.css?v=8">
    <link rel="stylesheet" href="../../commun/css/shell.css?v=8">
    <link rel="stylesheet" href="../../commun/css/themes.css?v=8">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="../../" title="Retour à Epure"><i data-icon="gamepad-2"></i> EPURE <span class="sep">/</span> Serpent</a>
        <div class="spacer"></div>
        <a class="icon-btn hidden" id="account-btn" href="../../pages/account.html" title="Compte"><i data-icon="circle-user"></i></a>
        <button class="icon-btn" data-action="toggle-sound" id="sound-btn" title="Son"></button>
        <button class="icon-btn" data-action="open-help" title="Contrôles"><i data-icon="keyboard"></i></button>
        <a class="icon-btn" href="../../pages/stats.html" title="Statistiques"><i data-icon="chart-column"></i></a>
        <button class="icon-btn" data-action="open-settings" title="Thème"><i data-icon="palette"></i></button>
    </header>

    <div class="app">
        <nav class="side">
            <p class="section-title">Modes</p>
            <button class="mode-item" data-mode="classic"><i data-icon="square"></i><span>Classique</span></button>
            <button class="mode-item" data-mode="wrap"><i data-icon="infinity"></i><span>Sans murs</span></button>
            <button class="mode-item" data-mode="maze"><i data-icon="brick-wall"></i><span>Labyrinthe</span></button>
            <button class="mode-item" data-mode="timed"><i data-icon="timer"></i><span>Chrono 90 s</span></button>
                    <p class="section-title">Face à face</p>
            <a class="mode-item" href="duel/?mode=bot"><i data-icon="bot"></i><span>Contre le bot</span></a>
            <a class="mode-item" href="duel/?mode=duel"><i data-icon="swords"></i><span>Duel 1v1</span></a>
        </nav>

        <main class="content">
            <section id="screen-setup" class="screen active">
                <div class="setup card">
                    <div class="setup-head">
                        <span class="setup-icon" id="setup-icon"></span>
                        <div><h2 id="setup-title"></h2><p class="muted" id="setup-desc"></p></div>
                    </div>
                    <p class="section-title">Vitesse</p>
                    <div class="seg" id="seg-speed">
                        <button data-speed="slow"><b>Lente</b><small>pour débuter</small></button>
                        <button data-speed="normal"><b>Normale</b><small>accélère en mangeant</small></button>
                        <button data-speed="fast"><b>Rapide</b><small>réflexes requis</small></button>
                    </div>
                    <ul class="rules" id="setup-rules"></ul>
                    <div class="setup-best muted" id="setup-best"></div>
                    <button class="btn primary block" data-action="play"><i data-icon="play"></i> Jouer</button>
                </div>
            </section>

            <section id="screen-game" class="screen">
                <div class="stage">
                    <div class="col">
                        <div class="panel stats" id="stats"></div>
                        <div class="panel actions">
                            <button class="icon-btn" data-action="pause" title="Pause (Échap)"><i data-icon="pause"></i></button>
                            <button class="icon-btn" data-action="restart" title="Recommencer (R)"><i data-icon="rotate-ccw"></i></button>
                            <button class="icon-btn" data-action="quit" title="Quitter"><i data-icon="arrow-left"></i></button>
                        </div>
                    </div>
                    <div class="well">
                        <canvas id="board"></canvas>
                        <div class="overlay hidden" id="overlay"></div>
                    </div>
                </div>
                <div class="touch" id="touch">
                    <span></span><button data-dir="up"><i data-icon="chevron-up"></i></button><span></span>
                    <button data-dir="left"><i data-icon="chevron-left"></i></button><button data-dir="down"><i data-icon="chevron-down"></i></button><button data-dir="right"><i data-icon="chevron-right"></i></button>
                </div>
            </section>
        </main>
    </div>

    <div class="modal hidden" id="modal">
        <div class="modal-card">
            <h2 id="modal-title"></h2>
            <p id="modal-text"></p>
            <div class="modal-actions" id="modal-actions"></div>
        </div>
    </div>
    <div class="modal hidden" id="settings">
        <div class="modal-card">
            <h2>Thème</h2>
            <div class="themes" id="themes"></div>
            <label class="toggle"><input type="checkbox" id="opt-grid"><span class="sw"></span><div><b>Quadrillage</b><small>Lignes de repère sur le terrain</small></div></label>
            <div class="modal-actions"><button class="btn primary" data-action="close-modal">Fermer</button></div>
        </div>
    </div>
    <div class="modal hidden" id="help">
        <div class="modal-card help">
            <h2>Contrôles</h2>
            <table class="keys">
                <tr><td><kbd>←</kbd> <kbd>↑</kbd> <kbd>→</kbd> <kbd>↓</kbd></td><td>Diriger le serpent</td></tr>
                <tr><td><kbd>Z</kbd> <kbd>Q</kbd> <kbd>S</kbd> <kbd>D</kbd></td><td>Diriger (clavier AZERTY)</td></tr>
                <tr><td><kbd>Espace</kbd> <kbd>Échap</kbd></td><td>Pause</td></tr>
                <tr><td><kbd>R</kbd></td><td>Recommencer</td></tr>
            </table>
            <p class="muted" style="margin-top:12px">Sur mobile : glisse le doigt sur le terrain, ou utilise les flèches.</p>
            <div class="modal-actions"><button class="btn primary" data-action="close-modal">Compris</button></div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="../../commun/js/config.js?v=8"></script>
    <script src="../../commun/js/i18n.js?v=8"></script>
    <script src="../../commun/js/ui.js?v=8"></script>
    <script src="../../commun/js/online.js?v=8"></script>
    <script src="../../commun/js/catalogue.js?v=8"></script>
    <script src="game.js?v=8"></script>
</body>
</html>
